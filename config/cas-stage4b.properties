# CAS 8.0.1 Stage 4B: the Jamf certificate is a Tomcat TLS admission gate,
# not a CAS authentication credential. The Stage 3 configuration is unchanged.
server.port=8443
server.servlet.context-path=/cas
server.ssl.enabled=true
server.ssl.key-store=file:/etc/cas/certs/localhost-x509.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-password=changeit
server.ssl.key-alias=cas
server.http2.enabled=true

# Require a trusted client certificate before any request reaches CAS.
server.ssl.client-auth=need
server.ssl.trust-store=file:/etc/cas/certs/jamf-client-truststore.jks
server.ssl.trust-store-type=JKS
server.ssl.trust-store-password=${CAS_X509_TRUSTSTORE_PASSWORD}

cas.server.name=https://localhost:9445
cas.server.prefix=${cas.server.name}/cas

# Stage 4B authenticates the user with the existing test user handler.
cas.authn.accept.users=${CAS_TEST_USER}::${CAS_TEST_PASSWORD}

# The test service validates STs over a container-network-only connector. It is
# intentionally not published to the host; the browser-facing connector above
# remains the only external CAS entry and always requires the Jamf certificate.
cas.server.tomcat.http[0].enabled=true
cas.server.tomcat.http[0].port=8080
cas.server.tomcat.http[0].protocol=org.apache.coyote.http11.Http11NioProtocol
cas.server.tomcat.http[0].scheme=http
cas.server.tomcat.http[0].secure=false

cas.webflow.crypto.encryption.key=${CAS_WEBFLOW_ENCRYPTION_KEY}
cas.webflow.crypto.signing.key=${CAS_WEBFLOW_SIGNING_KEY}
cas.tgc.crypto.encryption.key=${CAS_TGC_ENCRYPTION_KEY}
cas.tgc.crypto.signing.key=${CAS_TGC_SIGNING_KEY}

cas.service-registry.core.init-from-json=true
cas.service-registry.json.location=file:/etc/cas/services-stage4b

logging.config=file:/etc/cas/config/log4j2.xml
