# CAS 8.0.1 Tomcat/X.509 experiment configuration.
# The existing Jetty baseline continues to use config/cas.properties.
server.port=8443
server.servlet.context-path=/cas
server.ssl.enabled=true
server.ssl.key-store=file:/etc/cas/certs/localhost-x509.p12
server.ssl.key-store-type=PKCS12
# CAS 8.0.1's dedicated X.509 Tomcat connector relies on Tomcat's default
# PKCS12 store password. Keep this experiment-only server keystore isolated
# from the baseline keystore; this is not the Stage 2 Jamf truststore.
server.ssl.key-store-password=changeit
server.ssl.key-password=changeit
server.ssl.key-alias=cas

# The dedicated Tomcat X.509 connector copies these truststore settings from
# Spring Boot's server.ssl configuration. This JKS contains only the public
# Jamf issuing CA and is generated under the git-ignored runtime directory by
# scripts/prepare-jamf-truststore.sh. The Jetty baseline uses cas.properties
# and therefore never loads this truststore.
server.ssl.trust-store=file:/etc/cas/certs/jamf-client-truststore.jks
server.ssl.trust-store-type=JKS
server.ssl.trust-store-password=${CAS_X509_TRUSTSTORE_PASSWORD}

cas.server.name=https://localhost:9443
cas.server.prefix=${cas.server.name}/cas

# Keep the existing username/password flow enabled for the Stage 1 regression.
cas.authn.accept.users=${CAS_TEST_USER}::${CAS_TEST_PASSWORD}

# Use CAS 8.0.1's native mixed-mode X.509 Webflow on a dedicated connector.
cas.authn.x509.webflow.enabled=true
cas.authn.x509.webflow.port=8444
cas.authn.x509.webflow.client-auth=want
cas.authn.x509.mixed-mode=true

cas.webflow.crypto.encryption.key=${CAS_WEBFLOW_ENCRYPTION_KEY}
cas.webflow.crypto.signing.key=${CAS_WEBFLOW_SIGNING_KEY}
cas.tgc.crypto.encryption.key=${CAS_TGC_ENCRYPTION_KEY}
cas.tgc.crypto.signing.key=${CAS_TGC_SIGNING_KEY}

cas.service-registry.core.init-from-json=true

logging.config=file:/etc/cas/config/log4j2.xml
