# CAS 8.0.1 local-only POC configuration. Secrets are resolved from .env.
server.port=8443
server.servlet.context-path=/cas
server.ssl.enabled=true
server.ssl.key-store=file:/etc/cas/certs/localhost.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${CAS_KEYSTORE_PASSWORD}
server.ssl.key-password=${CAS_KEYSTORE_PASSWORD}
server.ssl.key-alias=cas

cas.server.name=https://localhost:8443
cas.server.prefix=${cas.server.name}/cas

# Local test credentials; values come from Docker Compose's env_file.
cas.authn.accept.users=${CAS_TEST_USER}::${CAS_TEST_PASSWORD}

# Persist local session cryptographic keys across container restarts. Values are
# generated into the git-ignored .env by start.sh.
cas.webflow.crypto.encryption.key=${CAS_WEBFLOW_ENCRYPTION_KEY}
cas.webflow.crypto.signing.key=${CAS_WEBFLOW_SIGNING_KEY}
cas.tgc.crypto.encryption.key=${CAS_TGC_ENCRYPTION_KEY}
cas.tgc.crypto.signing.key=${CAS_TGC_SIGNING_KEY}

# Import the HTTPS example service bundled with the official CAS WAR into the
# local in-memory registry. This keeps the quickstart self-contained.
cas.service-registry.core.init-from-json=true

logging.config=file:/etc/cas/config/log4j2.xml
